<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Glowing Leaf Emblem -->
  <g filter="url(#glow)" transform="translate(12, 12)">
    <!-- Main Leaf Body -->
    <path d="M5 35 C 5 35, 3 15, 20 5 C 37 15, 35 35, 35 35 C 35 35, 22 39, 5 35 Z" 
          fill="url(#leafGrad)" />
    <!-- Leaf Center Stem / Vein -->
    <path d="M20 5 C 19 18, 16 28, 5 35" 
          stroke="#022c22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Side Leaf Veins -->
    <path d="M19 15 C 23 18, 26 21, 28 23" 
          stroke="#022c22" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M18 22 C 22 25, 25 28, 27 31" 
          stroke="#022c22" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M17 20 C 13 22, 10 24, 8 26" 
          stroke="#022c22" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>
</svg>